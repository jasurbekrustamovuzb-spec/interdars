function start(l){PL.les=l;stopT();clearTimeout(PL.t2);PL.ans=PL.nx=PL.fifty=PL.take=PL.card=PL.tn=PL.ts=null;PL.tcount=2;

function result(l,pct,pts,xp,line,extra){stopT();

  if(pct>=50||up)setTimeout(function(){confetti(innerWidth/2,innerHeight*.3,pct>=80?64:28)},250)}
function teamSetup(l){
  function draw(){$('#pl').innerHTML=top(l.title,T('Jamoaviy jang'),'')+'<div class="res"><div class="rem">🛡️</div><h2>'+T('Nechta jamoa qatnashadi?')+'</h2><div class="pills" style="justify-content:center">'+[2,3].map(function(n){return '<button class="pill" aria-pressed="'+(PL.tcount===n)+'" data-tn="'+n+'">'+n+'</button>'}).join('')+'</div><p class="rl">'+T('Savollarga jamoalar navbat bilan javob beradi. Bitta qurilmada bajaring.')+'</p><div class="rb"><button class="cta" data-ts>'+T('Boshlash')+'</button></div></div>'}
  PL.tn=function(n){PL.tcount=n;draw()};PL.ts=function(){runQs(l,'team',TEAMS.slice(0,PL.tcount))};draw()}
function runQs(l,kind,teams){
  var items=qsFor(l,kind).filter(function(x){return x.a&&x.a.length>=2}).map(function(x){var idx=x.a.map(function(_,i){return i});shuffle(idx);return{q:x.q,a:idx.map(function(i){return x.a[i]}),c:idx.indexOf(x.c)}});
  if(!items.length){say(T('Bu darsda bu metodga mos savol yo’q'));return}
  if(kind!=='mill')shuffle(items);
  var N=items.length,i=0,pts=0,ok=0,locked=false,left=0,max=kind==='team'?25:20,used=false,nxt=null,sc=teams?teams.map(function(){return 0}):null,SH=['▲','◆','●','■'],CL=['a','b','c','d'];
  function turn(){return teams?i%teams.length:0}
  function tbar(){return '<div class="tbar">'+teams.map(function(t,j){return '<div class="tm'+(j===turn()?' on':'')+'"><span>'+t.e+'</span><b>'+T(t.n)+'</b><em>'+sc[j]+'</em></div>'}).join('')+'</div>'}
  function render(){var it=items[i];
    var h=top(l.title,T('Savol')+' '+(i+1)+' / '+N,kind==='mill'?'💰 '+fmt(ok?PR[ok-1]:0):kind==='quiz'?'⭐ '+fmt(pts):'');
    h+='<div class="pbar"><i style="width:'+(i/N*100)+'%"></i></div>';
    if(teams)h+=tbar();
    if(kind==='mill')h+='<div class="lad2">'+items.map(function(_,j){return '<span class="'+(j<i?'dn':j===i?'cu':'')+'">'+(j+1)+'</span>'}).join('')+'</div><div class="lif"><button class="lf" data-5050'+(used?' disabled':'')+'>50:50</button><button class="lf" data-take>'+T('Yutuqni olish')+'</button></div>';
    else h+='<div class="ptm"><i></i></div>';
    h+='<div class="pq">'+esc(it.q)+'</div><div class="pog">'+it.a.map(function(t,j){return '<button class="po '+CL[j]+'" data-o="'+j+'"><u>'+SH[j]+'</u><span>'+esc(t)+'</span></button>'}).join('')+'</div><div class="pfb" id="pfb"></div><div class="pnx"></div>';
    $('#pl').innerHTML=h;locked=false;stopT();
    if(kind!=='mill'){left=max;PL.timer=setInterval(function(){left-=.1;var b=$('#pl .ptm i');if(b)b.style.width=Math.max(0,left/max*100)+'%';if(left<=0)answer(-1)},100)}}
  function answer(j){if(locked)return;locked=true;stopT();var it=items[i],good=j===it.c,fb;
    $$('#pl .po').forEach(function(b,x){b.disabled=true;if(x===it.c)b.classList.add('ok');else if(x===j)b.classList.add('no');else b.classList.add('dim')});
    if(good){ok++;
      if(kind==='quiz'){var p=500+Math.round(500*Math.max(0,left)/max);pts+=p;fb='✅ '+T('To’g’ri!')+' +'+p}
      else if(kind==='mill')fb='✅ '+T('To’g’ri!')+' +'+fmt(PR[i]);
      else{sc[turn()]++;fb='✅ '+T('To’g’ri!')}}
    else fb=j<0?'⏱️ '+T('Vaqt tugadi'):'❌ '+T('Noto’g’ri');
    $('#pfb').innerHTML='<span class="fm">'+MS(good?'cheer':'oops')+'</span><span>'+fb+'</span>';
    var over=(kind==='mill'&&!good)||i===N-1;
    $('#pl .pnx').innerHTML='<button class="cta" data-nx>'+T(over?'Natijani ko’rish':'Keyingisi')+'</button>';
    nxt=function(){if(over)fin();else{i++;render()}}}
  function fin(){stopT();var pct=Math.round(ok/N*100),xp=ok*10+(pct===100?30:0),pt=pts,extra='';
    if(kind==='mill'){pt=ok?PR[ok-1]:0;extra='<p class="rl">💰 '+T('Yutuq')+': <b>'+fmt(pt)+'</b> '+T('ball')+'</p>'}
    else if(kind==='team'){var mx=Math.max.apply(null,sc),w=[];sc.forEach(function(s,j){if(s===mx)w.push(teams[j])});pt=mx;
      extra=tbar()+'<p class="rl">'+(w.length>1?'🤝 '+T('Durang'):'🏆 '+w[0].e+' '+T(w[0].n)+' '+T('g’olib!'))+'</p>'}
    else extra='<p class="rl">⭐ '+T('Ball')+': <b>'+fmt(pts)+'</b></p>';
    result(l,pct,pt,xp,ok+' / '+N,extra)}
  PL.ans=answer;PL.nx=function(){if(nxt)nxt()};
  PL.fifty=function(){if(used||locked)return;used=true;var it=items[i],wr=[];it.a.forEach(function(_,x){if(x!==it.c)wr.push(x)});shuffle(wr);
    wr.slice(0,Math.min(2,wr.length-1)).forEach(function(x){var b=$$('#pl .po')[x];if(b){b.disabled=true;b.classList.add('dim')}});var f=$('#pl [data-5050]');if(f)f.disabled=true};
  PL.take=function(){fin()};
  render()}
function runMem(l){var ps=l.pairs.slice(0,12),cards=[],op=[],done=0,moves=0,lock=false,t0=Date.now();
  ps.forEach(function(p,i){cards.push({id:i,t:p.t,k:'t',s:0},{id:i,t:p.d,k:'d',s:0})});shuffle(cards);
  function sec(){return Math.floor((Date.now()-t0)/1000)}
  function stats(){return '🎯 '+moves+' · ⏱️ '+sec()+' '+T('soniya')}
  $('#pl').innerHTML=top(l.title,T('Xotira kartalari'),'')+'<div class="pbar"><i id="mpb" style="width:0"></i></div><div class="mstat" id="mst"></div><div class="mgr" id="mgr"></div>';
  PL.timer=setInterval(function(){var e=$('#mst');if(e)e.textContent=stats()},1000);
  function grid(){$('#mgr').innerHTML=cards.map(function(c,x){return '<button class="mcd '+(c.s===2?'dn ':c.s===1?'op ':'')+(c.k==='t'?'tk':'dk')+'" data-c="'+x+'"'+(c.s?' disabled':'')+'><span>'+(c.s?esc(c.t):'?')+'</span></button>'}).join('');$('#mst').textContent=stats();$('#mpb').style.width=(done/ps.length*100)+'%'}
  function fin(){stopT();var n=ps.length,pct=Math.max(1,Math.round(n/moves*100)),pt=Math.max(0,n*100-(moves-n)*20),xp=n*5+(moves===n?20:0);
    result(l,pct,pt,xp,moves+' '+T('urinish')+' · '+sec()+' '+T('soniya'),'')}
  PL.card=function(x){var c=cards[x];if(lock||c.s)return;c.s=1;op.push(x);
    if(op.length===2){moves++;var a=cards[op[0]],b=cards[op[1]];
      if(a.id===b.id&&a.k!==b.k){a.s=b.s=2;done++;op=[];if(done===ps.length){grid();PL.t2=setTimeout(fin,600);return}}
      else{lock=true;var o2=op.slice();op=[];PL.t2=setTimeout(function(){o2.forEach(function(y){cards[y].s=0});lock=false;grid()},900)}}
    grid()};
  grid()}
$('#pl').addEventListener('click',function(e){var t=e.target,b;

  if((b=t.closest('[data-tn]'))&&PL.tn){PL.tn(+b.dataset.tn);return}

function qbParse(txt){var out=[],noAns=0,blocks=String(txt||'').replace(/\r/g,'').split(/\n[ \t]*\n+/);
  blocks.forEach(function(b){var ls=b.split('\n').map(function(s){return s.trim()}).filter(Boolean);if(ls.length<2)return;
    var q=ls[0].replace(/^(?:savol\s*)?\d{1,3}\s*[.):]\s*/i,'').replace(/^savol\s*:\s*/i,'').trim(),o=[],c=-1,ans=-1,at='';

      s=s.replace(/^\(?[A-Da-d]\s*[).:]\s*/,'').replace(/^[-•–]\s+/,'');
      if(/^[*+✓✔]\s*/.test(s)){mark=true;s=s.replace(/^[*+✓✔]\s*/,'')}
      if(/\s*[*✓✔]\s*$/.test(s)){mark=true;s=s.replace(/\s*[*✓✔]\s*$/,'')}

    if(o.length>=2){if(at){var ix=o.map(nz).indexOf(nz(at));if(ix>-1)ans=ix}if(ans>-1&&ans<o.length)c=ans;if(c<0){c=0;noAns++}out.push({q:q,a:o,c:c});return}
